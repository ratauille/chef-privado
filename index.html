<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>franko / Chef Privado - Formulario Seguro con reCAPTCHA Enterprise</title>

  <!-- Google reCAPTCHA Enterprise Script (Proyecto: chef4youbyfranko) -->
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Lc6v7gtAAAAAPYVODf4-6g1NTwkOqguBVUIVqdy"></script>
</head>
<body>
  <div class="container" style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
    <h2>ChefOS - Iniciar Sesión</h2>
    
    <form id="login-form">
      <div style="margin-bottom: 15px;">
        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" name="email" style="width: 100%; padding: 8px;" required>
      </div>

      <div style="margin-bottom: 15px;">
        <label for="password">Contraseña:</label><br>
        <input type="password" id="franko" name="franko" style="width: 100%; padding: 8px;" required>
      </div>

      <!-- Campo oculto recomendado para el token de respuesta (g-recaptcha-response) -->
      <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">

      <button type="submit" id="submit-btn" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">
        Iniciar Sesión
      </button>
    </form>

    <div id="status-message" style="margin-top: 15px; font-weight: bold;"></div>
  </div>

  <script>
    const SITE_KEY = "6Lc6v7gtAAAAAPYVODf4-6g1NTwkOqguBVUIVqdy";

    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const statusDiv = document.getElementById("status-message");
      statusDiv.innerText = "Verificando seguridad con reCAPTCHA Enterprise...";

      grecaptcha.enterprise.ready(async () => {
        try {
          // Generar el token de respuesta reCAPTCHA v3 / Enterprise
          const token = await grecaptcha.enterprise.execute(SITE_KEY, { action: "LOGIN" });
          document.getElementById("g-recaptcha-response").value = token;

          // Enviar el token y datos al backend de producción en Cloud Run
          const response = await fetch("/api/auth/verify-recaptcha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: token,
              recaptchaAction: "LOGIN"
            })
          });

          const result = await response.json();

          if (result.valid) {
            statusDiv.style.color = "green";
            statusDiv.innerText = `✅ Verificación exitosa. Puntuación de riesgo: ${result.score}`;
          } else {
            statusDiv.style.color = "red";
            statusDiv.innerText = `❌ Error de seguridad (${result.reason || "Acceso denegado"})`;
          }
        } catch (err) {
          console.error("Error al procesar reCAPTCHA:", err);
          statusDiv.style.color = "red";
          statusDiv.innerText = "⚠️ Error de conexión con el servidor.";
        }
      });
    });
  </script>
</body>
</html>
