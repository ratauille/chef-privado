<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef Privado - Login</title>

  <!-- Google reCAPTCHA Enterprise Script -->
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LeNx7gtAAAAAPqpo5Hcnn7-JCpOp_GML8W6T01N"></script>
</head>
<body>
  <div class="container">
    <h1>Chef Privado</h1>
    <form id="login-form">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <button id="submit-btn" onclick="onClick(event)">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    function onClick(e) {
      e.preventDefault();
      grecaptcha.enterprise.ready(async () => {
        const token = await grecaptcha.enterprise.execute("6LeNx7gtAAAAAPqpo5Hcnn7-JCpOp_GML8W6T01N", {action: "LOGIN"});
        console.log("reCAPTCHA Token generado:", token);

        // Enviar al servidor para crear la evaluación (Assessment)
        try {
          const response = await fetch("/api/verify-recaptcha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: token,
              action: "LOGIN"
            })
          });

          const result = await response.json();
          console.log("Resultado de evaluación:", result);

          if (result.success) {
            alert(`Acceso concedido. Score: ${result.score}`);
          } else {
            alert(`Acceso denegado o actividad sospechosa (Score: ${result.score || 0})`);
          }
        } catch (err) {
          console.error("Error al conectar con la API de evaluación:", err);
        }
      });
    }
  </script>
</body>
</html>
