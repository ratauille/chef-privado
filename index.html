<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef Privado - Login</title>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Lc6v7gtAAAAAPYVODf4-6g1NTwkOqguBVUIVqdy"></script>
</head>
<body>
  <div class="container">
    <h1>Chef Privado</h1>
    <form id="login-form">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <button id="submit-btn" onclick="onClick(event)">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    function onClick(e) {
      e.preventDefault();
      grecaptcha.enterprise.ready(async () => {
        const token = await grecaptcha.enterprise.execute("6Lc6v7gtAAAAAPYVODf4-6g1NTwkOqguBVUIVqdy", {action: "LOGIN"});
        console.log("reCAPTCHA Token generado:", token);
      });
    }
  </script>
</body>
</html>
