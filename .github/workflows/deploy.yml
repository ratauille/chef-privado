name: Deploy ChefOS Backend to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push Container Image
        run: |
          gcloud builds submit --tag us-central1-docker.pkg.dev/chefos-502422/chefos-repo/chefos-backend:latest --project=chefos-502422

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy chefos-backend \
            --image=us-central1-docker.pkg.dev/chefos-502422/chefos-repo/chefos-backend:latest \
            --region=us-central1 \
            --project=chefos-502422
